global:
  resolve_timeout: 5m
  # <-- replace with your slack webhook
  slack_api_url: "<slack-webhook-url>"

route:
  receiver: "slack-default"
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      severity: critical
    receiver: "critical"
    continue: true
  - match:
      severity: warning
    receiver: "slack-default"

receivers:
- name: "slack-default"
  slack_configs:
  - channel: "#alerts"
    send_resolved: true
    title: "{{ .GroupLabels.alertname }} ({{ .Status | toUpper }})"
    text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"

- name: "critical"
  # <-- replace with your pagerduty integration key
  pagerduty_configs:
  - service_key: "<pagerduty-integration-key>"
    send_resolved: true
    description: "{{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }} {{ end }}"
  slack_configs:
  - channel: "#alerts-critical"
    send_resolved: true
    title: "CRITICAL: {{ .GroupLabels.alertname }}"
    text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"

inhibit_rules:
# if the node is down, don't also page for every pod on it
- source_match:
    alertname: "NodeDown"
    severity: "critical"
  target_match_re:
    alertname: "PodCrashLooping|KubePodNotReady"
  equal: ["instance"]
